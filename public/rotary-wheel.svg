<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#F7A81B" stroke-width="4"/>
  <circle cx="50" cy="50" r="12" fill="#F7A81B"/>
  <circle cx="50" cy="50" r="7" fill="#003087"/>
  <!-- 6 spokes -->
  <g stroke="#F7A81B" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="20" x2="50" y2="38"/>
    <line x1="50" y1="62" x2="50" y2="80"/>
    <line x1="22.3" y1="35" x2="37.9" y2="44"/>
    <line x1="62.1" y1="56" x2="77.7" y2="65"/>
    <line x1="22.3" y1="65" x2="37.9" y2="56"/>
    <line x1="62.1" y1="44" x2="77.7" y2="35"/>
  </g>
  <!-- 6 teeth on outer ring -->
  <g fill="#F7A81B">
    <rect x="46.5" y="4" width="7" height="10" rx="2"/>
    <rect x="46.5" y="86" width="7" height="10" rx="2" transform="rotate(180 50 91)"/>
    <rect x="46.5" y="4" width="7" height="10" rx="2" transform="rotate(60 50 50)"/>
    <rect x="46.5" y="4" width="7" height="10" rx="2" transform="rotate(120 50 50)"/>
    <rect x="46.5" y="4" width="7" height="10" rx="2" transform="rotate(240 50 50)"/>
    <rect x="46.5" y="4" width="7" height="10" rx="2" transform="rotate(300 50 50)"/>
  </g>
</svg>
